name: vnavmesh CN 따라가기

# AtmoOmen의 vnavmesh CN이 업데이트되면 버전 번호만 올린 사본을 이 저장소에 올린다.
# (원본 vnavmesh와 내부 이름이 같아서, 버전이 낮은 CN판이 지워지는 것을 막기 위함)

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vnavmesh-cn
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CN판 새 버전 확인
        run: python3 scripts/vnavmesh_cn.py

      - name: 바뀌었으면 올리기
        run: |
          if git diff --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ver=$(python3 -c "import json;print(next(e['AssemblyVersion'] for e in json.load(open('repo.json',encoding='utf-8-sig')) if e['InternalName']=='vnavmesh'))")
          git add repo.json plugins/vnavmesh/latest.zip
          git commit -m "vnavmesh CN ${ver}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
